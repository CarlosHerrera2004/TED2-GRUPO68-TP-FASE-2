<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>WebAR - MindAR + Three.js</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="stylesheet" href="./css/style.css?v=pantalla_inicio_v1">

  <!-- Polyfill para compatibilidad con Import Maps en versiones anteriores de Safari en iOS -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>

  <!-- Definición de dependencias ES Modules (Three.js v0.160.0 y MindAR v1.2.5) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <!-- Módulo principal de la aplicación -->
  <script type="module" src="./js/app.js?v=pantalla_inicio_v1"></script>
</head>
<body>

  <!-- Contenedor principal donde MindAR inserta el feed de video y el canvas WebGL -->
  <div id="ar-container"></div>

  <!-- Pantalla inicial previa a la activación de la cámara con fondo temático -->
  <div id="welcome-screen" class="welcome-screen">
    <!-- Barra superior con botón rectangular hacia el sitio web principal -->
    <header class="top-nav-bar">
      <a href="https://mgalibnz.wixstudio.com/ted-2-grupo68" class="btn-top-back" id="btn-top-back" target="_blank" rel="noopener noreferrer">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Volver al inicio</span>
      </a>
    </header>

    <!-- Tarjeta central de presentación de la experiencia -->
    <div class="welcome-card">
      <h1 class="main-title">EXPERIENCIA DE REALIDAD AUMENTADA</h1>
      <h2 class="sub-title">Muestra de Micro-Racismos</h2>

      <p class="description">Esta experiencia utiliza la cámara de tu dispositivo para proyectar la experiencia interactiva sobre el desplegable físico.</p>
      
      <div class="instruction-box">
        <p class="instruction-text">Apuntá la cámara hacia la imagen del desplegable</p>
      </div>

      <button id="btn-start" class="btn-start">INICIAR EXPERIENCIA</button>

      <!-- Mensaje de error (oculto por defecto) -->
      <div id="error-message" class="error-box hidden" role="alert"></div>
    </div>

    <!-- Espaciador inferior para balance visual -->
    <div class="bottom-spacer"></div>
  </div>

  <!-- Capa de interfaz superpuesta durante la experiencia AR -->
  <div id="ar-ui" class="ar-ui hidden">
    <!-- Indicador de tracking discreto (solo avisa si la imagen está detectada o buscándose) -->
    <div id="status-indicator" class="status-indicator searching">
      <span class="status-dot"></span>
      <span id="status-text">Buscando imagen...</span>
    </div>

    <!-- Botón rectangular para regresar / detener cámara -->
    <button id="btn-stop" class="btn-stop" aria-label="Detener cámara">DETENER CÁMARA</button>
  </div>

</body>
</html>
